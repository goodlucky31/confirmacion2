<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Venta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: #1a1a2e;
      color: white;
      border-radius: 12px;
    }
    h2 { text-align: center; color: #FFD700; margin-bottom: 20px; }
    label { font-size: 13px; font-weight: bold; color: #ccc; display: block; margin-bottom: 4px; }
    .opcional { color: #888; font-size: 11px; margin-left: 5px; }
    input, select {
      width: 100%;
      padding: 11px;
      margin-bottom: 13px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      background: #f5f5f5;
      color: #111;
    }
    .fila-dos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .separador {
      border: none;
      border-top: 1px solid #333;
      margin: 15px 0;
    }
    .seccion-titulo {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #FFD700;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.2s;
    }
    button:hover { background: #FFC200; }
    button:disabled { background: #555; color: #999; cursor: not-allowed; }
    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.5;
    }
    .score-bar {
      background: #333;
      border-radius: 20px;
      height: 10px;
      margin: 8px 0 5px 0;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff5252, #ffcc00, #00e676);
      border-radius: 20px;
      transition: width 0.4s;
    }
    .score-label {
      text-align: right;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h2>🎰 Confirmar Venta</h2>

  <!-- Barra de calidad -->
  <div class="seccion-titulo">📊 Calidad del evento</div>
  <div class="score-bar">
    <div class="score-fill" id="scoreFill" style="width:0%"></div>
  </div>
  <div class="score-label" id="scoreLabel">Completá los campos</div>

  <hr class="separador">

  <!-- OBLIGATORIOS -->
  <div class="seccion-titulo">🔴 Obligatorios</div>

  <label>💰 Monto en ARS:</label>
  <input type="number" id="monto" placeholder="Ej: 5000" oninput="actualizarScore()">

  <label>📱 Teléfono (con código de país, sin +):</label>
  <input type="text" id="telefono" placeholder="Ej: 5491112345678" oninput="actualizarScore()">

  <hr class="separador">

  <!-- OPCIONALES -->
  <div class="seccion-titulo">🟡 Datos del cliente y Atribución</div>

  <label>🔑 Código REF de WhatsApp <span class="opcional">recomendado</span></label>
  <input type="text" id="ref" placeholder="Ej: REF-1715830000000-a1b2c" oninput="actualizarScore()">

  <div class="fila-dos">
    <div>
      <label>👤 Nombre <span class="opcional">opcional</span></label>
      <input type="text" id="nombre" placeholder="Juan" oninput="actualizarScore()">
    </div>
    <div>
      <label>👤 Apellido <span class="opcional">opcional</span></label>
      <input type="text" id="apellido" placeholder="Perez" oninput="actualizarScore()">
    </div>
  </div>

  <label>⚧ Género <span class="opcional">opcional</span></label>
  <select id="genero" onchange="actualizarScore()">
    <option value="">— No especificar —</option>
    <option value="m">👨 Masculino</option>
    <option value="f">👩 Femenino</option>
  </select>

  <button id="btnConfirmar" onclick="confirmarVenta()">✅ Confirmar Venta</button>

  <div id="mensaje"></div>

  <script>
    // ✅ CONFIGURACIÓN GENERAL
    const PIXEL_ID     = '2141536543066953';
    const ACCESS_TOKEN = 'EAAcLCVnJCDoBSPAZBVjvVGxtaltZCF8W4cnwWhtmDApHEecR0J7KhmG0x5xT8mLqFPqTZCfQF5I1pRSQ8keLsJOExuh1srOGQm9tw3v9tTkRcEacih96DcbsTDEypZCQ5dgZAjfPoAlXFE2Xt6QQp9V9NVN5yKMsKh3KelSE27X4zdxdyHnncMeu1ntiPpylElAZDZD';

    // ─── Leer Cookies de Meta ──────────────────────────────────────
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    // ─── Hash SHA-256 ─────────────────────────────────────────────
    async function hashData(data) {
      if (!data || data.trim() === '') return null;
      const msgBuffer = new TextEncoder().encode(data.trim().toLowerCase());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ─── Score en tiempo real ─────────────────────────────────────
    function actualizarScore() {
      const campos = [
        document.getElementById('monto').value,
        document.getElementById('telefono').value,
        document.getElementById('ref').value,
        document.getElementById('nombre').value,
        document.getElementById('apellido').value,
        document.getElementById('genero').value,
        'ar'
      ];

      const llenos = campos.filter(c => c && c.trim() !== '').length;
      const porcentaje = Math.round((llenos / campos.length) * 100);

      document.getElementById('scoreFill').style.width = porcentaje + '%';

      let label = '';
      if (porcentaje <= 35)      label = `⚠️ Score bajo (${porcentaje}%)`;
      else if (porcentaje <= 65) label = `🟡 Score medio (${porcentaje}%)`;
      else if (porcentaje <= 85) label = `🟢 Score bueno (${porcentaje}%)`;
      else                       label = `🏆 Score excelente (${porcentaje}%) — máximo matching`;

      document.getElementById('scoreLabel').textContent = label;
    }

    // ─── Confirmar Venta ──────────────────────────────────────────
    async function confirmarVenta() {
      const monto     = document.getElementById('monto').value;
      const telefono  = document.getElementById('telefono').value.trim();
      const refCode   = document.getElementById('ref').value.trim();
      const nombre    = document.getElementById('nombre').value.trim();
      const apellido  = document.getElementById('apellido').value.trim();
      const genero    = document.getElementById('genero').value;
      const divMsg    = document.getElementById('mensaje');
      const btn       = document.getElementById('btnConfirmar');

      if (!monto || parseFloat(monto) <= 0) {
        divMsg.innerHTML = '⚠️ Ingresá un monto válido';
        divMsg.style.color = '#ffcc00';
        return;
      }
      if (!telefono) {
        divMsg.innerHTML = '⚠️ El teléfono es obligatorio';
        divMsg.style.color = '#ffcc00';
        return;
      }

      btn.disabled = true;
      divMsg.innerHTML = '⏳ Enviando evento a Meta...';
      divMsg.style.color = '#ffffff';

      const telefonoLimpio = telefono.replace(/\D/g, '');

      // ─── Captura de datos de usuario y cookies de rastreo ───
      const user_data = {
        client_user_agent: navigator.userAgent,
        fbp: getCookie('_fbp') || sessionStorage.getItem('casino_fbp') || '',
        fbc: getCookie('_fbc') || sessionStorage.getItem('casino_fbc') || '',
        country: ['ar']
      };

      if (refCode) {
        const refHash = await hashData(refCode);
        if (refHash) user_data.external_id = [refHash];
      }

      const phHash = await hashData(telefonoLimpio);
      const fnHash = await hashData(nombre);
      const lnHash = await hashData(apellido);
      const geHash = await hashData(genero);

      if (phHash) user_data.ph = [phHash];
      if (fnHash) user_data.fn = [fnHash];
      if (lnHash) user_data.ln = [lnHash];
      if (geHash) user_data.ge = [geHash];

      const eventId = 'purchase_' + Date.now() + '_' + Math.random().toString(36).substring(2);

      // 3. Payload limpio para producción (sin test_event_code)
      const payload = {
        data: [{
          event_name:       'Purchase',
          event_time:       Math.floor(Date.now() / 1000),
          event_id:         eventId,
          action_source:    'website',
          event_source_url: 'https://goodlucky31.github.io/landing/',
          custom_data: {
            value:    parseFloat(monto),
            currency: 'ARS'
          },
          user_data: user_data
        }],
        access_token: ACCESS_TOKEN
      };

      // 4. Envío a Meta CAPI
      try {
        const response = await fetch(
          `https://graph.facebook.com/v19.0/${PIXEL_ID}/events`,
          {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify(payload)
          }
        );
        const data = await response.json();

        if (data.events_received) {
          divMsg.innerHTML = `
            ✅ ¡Venta registrada en Meta!<br>
            <small style="color:#aaa">ID: ${eventId}</small>
          `;
          divMsg.style.color = '#00e676';

          ['monto','telefono','ref','nombre','apellido'].forEach(id => {
            document.getElementById(id).value = '';
          });
          document.getElementById('genero').value = '';
          actualizarScore();

        } else {
          divMsg.innerHTML = '❌ Error Meta: ' + (data.error?.message ?? JSON.stringify(data));
          divMsg.style.color = '#ff5252';
        }

      } catch (e) {
        divMsg.innerHTML = '❌ Error de conexión: ' + e.message;
        divMsg.style.color = '#ff5252';
      } finally {
        btn.disabled = false;
      }
    }

    actualizarScore();
  </script>

</body>
</html>
