<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Venta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 80px auto;
      padding: 20px;
      background: #1a1a2e;
      color: white;
      border-radius: 12px;
    }
    h2 { text-align: center; color: #FFD700; }
    label { font-size: 14px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #FFD700;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #FFC200; }
    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>🎰 Confirmar Venta</h2>

  <label>👤 Nombre del titular (del comprobante):</label>
  <input type="text" id="nombre" placeholder="Ej: Juan Perez">

  <label>💰 Monto en ARS:</label>
  <input type="number" id="monto" placeholder="Ej: 5000">

  <label>📱 Teléfono cliente (sin espacios ni +):</label>
  <input type="text" id="telefono" placeholder="Ej: 5491112345678">

  <button onclick="confirmarVenta()">✅ Confirmar Venta</button>

  <div id="mensaje"></div>

  <script>
    const PIXEL_ID = '2141536543066953';
    const ACCESS_TOKEN = 'EAAcLCVnJCDoBSDYwlYeEqAmxbFmQkcHpUtWZCCRc9CUMyN0dZAhMqvq1UkQQ5fB2kQfZAcmozI2LIbWaEJZBtdKv0Dyuy3HbkDaxuEsIgxaLcNBzoLqGvZCNkXe9aqCd24lcbe6cKvVvA7VzO8bZCep73X8ydYZBEZCLOQ06ZB55vjRtT6bMDqQSWbXeVh5bkO8GJBwZDZD';

    async function hashData(data) {
      if (!data) return '';
      const msgBuffer = new TextEncoder().encode(data.trim().toLowerCase());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function confirmarVenta() {
      const nombre = document.getElementById('nombre').value;
      const monto = document.getElementById('monto').value;
      const telefono = document.getElementById('telefono').value;
      const divMensaje = document.getElementById('mensaje');

      if (!monto || monto <= 0) {
        divMensaje.innerHTML = '⚠️ Ingresá un monto válido';
        divMensaje.style.color = '#ffcc00';
        return;
      }

      if (!telefono) {
        divMensaje.innerHTML = '⚠️ Ingresá al menos el teléfono del cliente';
        divMensaje.style.color = '#ffcc00';
        return;
      }

      divMensaje.innerHTML = '⏳ Enviando a Meta...';
      divMensaje.style.color = '#ffffff';

      // Generamos un event_id único para la deduplicación del Purchase
      const uniqueEventId = 'purchase_' + Date.now() + '_' + Math.random().toString(36).substring(2);

      const user_data = {
        client_user_agent: navigator.userAgent
      };

      if (telefono) {
        user_data.ph = [await hashData(telefono)];
      }

      // Si cargaste el nombre, lo dividimos en Nombre (fn) y Apellido (ln) automáticamente
      if (nombre) {
        const partes = nombre.trim().split(' ');
        user_data.fn = [await hashData(partes[0])];
        if (partes.length > 1) {
          user_data.ln = [await hashData(partes[partes.length - 1])];
        }
      }

      const payload = {
        data: [{
          event_name: 'Purchase',
          event_time: Math.floor(Date.now() / 1000),
          event_id: uniqueEventId,
          action_source: 'website',
          custom_data: {
            value: parseFloat(monto),
            currency: 'ARS'
          },
          user_data: user_data
        }],
        access_token: ACCESS_TOKEN
      };

      fetch(`https://graph.facebook.com/v18.0/${PIXEL_ID}/events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(d => {
        if (d.events_received) {
          divMensaje.innerHTML = '✅ ¡Venta registrada y enviada con éxito!';
          divMensaje.style.color = '#00e676';
          document.getElementById('nombre').value = '';
          document.getElementById('monto').value = '';
          document.getElementById('telefono').value = '';
        } else {
          divMensaje.innerHTML = '❌ Error de Meta: ' + (d.error ? d.error.message : JSON.stringify(d));
          divMensaje.style.color = '#ff5252';
        }
      })
      .catch(e => {
        divMensaje.innerHTML = '❌ Error de conexión';
        divMensaje.style.color = '#ff5252';
      });
    }
  </script>
</body>
</html>
