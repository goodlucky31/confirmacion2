<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Venta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 100px auto;
      padding: 20px;
      background: #1a1a2e;
      color: white;
      border-radius: 12px;
    }
    h2 { text-align: center; color: #FFD700; }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #FFD700;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #FFC200; }
    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>🎰 Confirmar Venta</h2>

  <label>💰 Monto en ARS:</label>
  <input type="number" id="monto" placeholder="Ej: 5000">

  <label>📱 Teléfono cliente (sin espacios ni +):</label>
  <input type="text" id="telefono" placeholder="Ej: 5491112345678">

  <label>📧 Email cliente (opcional):</label>
  <input type="email" id="email" placeholder="Ej: juan@gmail.com">

  <button onclick="confirmarVenta()">✅ Confirmar Venta</button>

  <div id="mensaje"></div>

  <script>
    const PIXEL_ID = '2141536543066953';
    const ACCESS_TOKEN = 'EAAcLCVnJCDoBSDYwlYeEqAmxbFmQkcHpUtWZCCRc9CUMyN0dZAhMqvq1UkQQ5fB2kQfZAcmozI2LIbWaEJZBtdKv0Dyuy3HbkDaxuEsIgxaLcNBzoLqGvZCNkXe9aqCd24lcbe6cKvVvA7VzO8bZCep73X8ydYZBEZCLOQ06ZB55vjRtT6bMDqQSWbXeVh5bkO8GJBwZDZD';
    const TEST_EVENT_CODE = 'TEST97429';

    async function hashData(data) {
      const msgBuffer = new TextEncoder().encode(data.trim().toLowerCase());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function confirmarVenta() {
      const monto = document.getElementById('monto').value;
      const telefono = document.getElementById('telefono').value;
      const email = document.getElementById('email').value;

      if (!monto || monto <= 0) {
        document.getElementById('mensaje').innerHTML = '⚠️ Ingresá un monto válido';
        return;
      }

      if (!telefono && !email) {
        document.getElementById('mensaje').innerHTML = '⚠️ Ingresá al menos teléfono o email';
        return;
      }

      document.getElementById('mensaje').innerHTML = '⏳ Enviando...';

      const user_data = {
        client_user_agent: navigator.userAgent
      };

      if (telefono) {
        user_data.ph = [await hashData(telefono)];
      }

      if (email) {
        user_data.em = [await hashData(email)];
      }

      const payload = {
        data: [{
          event_name: 'Purchase',
          event_time: Math.floor(Date.now() / 1000),
          action_source: 'website',
          custom_data: {
            value: parseFloat(monto),
            currency: 'ARS'
          },
          user_data: user_data
        }],
        access_token: ACCESS_TOKEN,
        test_event_code: TEST_EVENT_CODE
      };

      fetch(`https://graph.facebook.com/v18.0/${PIXEL_ID}/events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(d => {
        if (d.events_received) {
          document.getElementById('mensaje').innerHTML = '✅ Venta enviada a Meta correctamente!';
          document.getElementById('monto').value = '';
          document.getElementById('telefono').value = '';
          document.getElementById('email').value = '';
        } else {
          document.getElementById('mensaje').innerHTML = '❌ Error: ' + JSON.stringify(d);
        }
      })
      .catch(e => {
        document.getElementById('mensaje').innerHTML = '❌ Error de conexión';
      });
    }
  </script>
</body>
</html>
